{% load i18n uz %}<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.auto_id }}-name">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  <div class="picker picker-field">
  {% include "partials/icon.html" with name="search" %}
  <input id="{{ field.auto_id }}-name" type="search" value="{{ field|picked_name }}"
         placeholder="{% if placeholder %}{{ placeholder }}{% else %}{% translate 'Type a name…' %}{% endif %}" autocomplete="off"
         role="combobox" aria-expanded="false" aria-controls="{{ field.auto_id }}-results"
         data-live-search="{% url 'genealogy:search_json' %}?{% if owner %}owner={{ owner|urlencode }}&amp;{% endif %}{% if gender %}gender={{ gender }}{% endif %}"
         data-mode="pick" data-pick-target="{{ field.auto_id }}" data-pick-clear>
  <div class="live-results" id="{{ field.auto_id }}-results" role="listbox" hidden></div>
  </div>
  <input type="hidden" name="{{ field.html_name }}" id="{{ field.auto_id }}" value="{{ field.value|default_if_none:'' }}">
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
</div>
